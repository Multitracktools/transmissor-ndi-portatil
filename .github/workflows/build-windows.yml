name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o projeto
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Obter o redistribuível oficial do NDI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ndi.link/NDIRedistV6" -OutFile "$env:RUNNER_TEMP\ndi-runtime.exe"
          $process = Start-Process -FilePath "$env:RUNNER_TEMP\ndi-runtime.exe" -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "O instalador do runtime NDI terminou com o código $($process.ExitCode)."
          }

      - name: Montar pacote portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\Transmissor NDI Portatil.exe" "dist\Transmissor NDI Portatil.exe"

          $ndiDll = Get-ChildItem -Path "C:\Program Files\NDI", "C:\Program Files\NewTek" `
            -Filter "Processing.NDI.Lib.x64.dll" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $ndiDll) {
            throw "A DLL redistribuível do NDI não foi localizada após a instalação no runner."
          }
          Copy-Item $ndiDll.FullName "dist\Processing.NDI.Lib.x64.dll"
          Copy-Item "README-TESTE.txt" "dist\LEIA-ME.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist\AVISOS-DE-TERCEIROS.txt"
          Compress-Archive -Path "dist\*" -DestinationPath "Transmissor-NDI-Portatil-Windows-x64.zip"

      - name: Publicar artifact de teste
        uses: actions/upload-artifact@v4
        with:
          name: Transmissor-NDI-Portatil-Windows-x64
          path: Transmissor-NDI-Portatil-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
