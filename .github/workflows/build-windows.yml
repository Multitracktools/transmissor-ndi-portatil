name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o projeto
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Obter o redistribuível oficial do NDI
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $installerPath = "$env:RUNNER_TEMP\ndi-runtime.exe"
          $ndiRuntimeDir = "$env:RUNNER_TEMP\ndi-runtime"

          Invoke-WebRequest `
            -Uri "https://ndi.link/NDIRedistV6" `
            -OutFile $installerPath

          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$ndiRuntimeDir`""

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "O instalador do runtime NDI terminou com o código $($process.ExitCode)."
          }

      - name: Montar pacote portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "build\Release\Transmissor NDI Portatil.exe" `
            "dist\Transmissor NDI Portatil.exe"

          $ndiDll = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\ndi-runtime", "C:\Program Files\NDI", "C:\Program Files\NewTek" `
            -Filter "Processing.NDI.Lib.x64.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ndiDll) {
            throw "A DLL redistribuível do NDI não foi localizada."
          }

          Copy-Item `
            $ndiDll.FullName `
            "dist\Processing.NDI.Lib.x64.dll"

          Copy-Item "README-TESTE.txt" "dist\LEIA-ME.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist\AVISOS-DE-TERCEIROS.txt"

      - name: Publicar artifact de teste
        uses: actions/upload-artifact@v4
        with:
          name: Transmissor-NDI-Portatil-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
